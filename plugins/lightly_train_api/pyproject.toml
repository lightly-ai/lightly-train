[project]
name = "lightly_plugins_lightly_train_api"
version = "0.1.0"
description = "Train and serve a LightlyTrain API model from LightlyStudio"
requires-python = ">=3.11"
dependencies = [
    "lightly_studio>=1.1.2",
    "httpx>=0.27",
    "sqlmodel",
]

[project.entry-points."lightly_studio.plugins"]
lightly_train_api_training = "lightly_plugins_lightly_train_api.training_operator:LightlyTrainApiTrainingOperator"
lightly_train_api_inference = "lightly_plugins_lightly_train_api.inference_operator:LightlyTrainApiInferenceOperator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lightly_plugins_lightly_train_api"]

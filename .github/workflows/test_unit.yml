name: Test Unit

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  # Install packages into system environment.
  # Follows: https://docs.astral.sh/uv/guides/integration/github/#using-uv-pip
  UV_SYSTEM_PYTHON: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-code-changes:
    name: Detect Code Changes
    runs-on: ubuntu-latest
    outputs:
      run-tests: ${{ steps.filter.outputs.run-tests }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # NOTE: The patterns below are OR-ed together, the filter matches if ANY
          # pattern matches a changed file. Therefore only list positive patterns.
          # A list of negated patterns (e.g. '!docs/**' plus '!docker/**') always
          # matches, because a file excluded by one pattern is matched by the others.
          #
          # templates/** is included because tests/templates/ reads the templates from
          # the repository root.
          filters: |
            run-tests:
              - 'src/**'
              - 'tests/**'
              - 'templates/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Makefile'
              - '.github/workflows/test_unit.yml'
  test-unit:
    name: Test Unit
    needs: detect-code-changes
    if: needs.detect-code-changes.outputs.run-tests == 'true'
    strategy:
      matrix:
        runners: ["ubuntu-latest", "windows-latest"]
    runs-on: ${{ matrix.runners }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Set Up uv
        uses: astral-sh/setup-uv@v7
        id: setup-uv
        with:
          version: 0.11.15
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
      - name: Set Up Environment
        run: |
          make install-pinned-3.13
      - name: Run Pytest
        run: |
          make test-ci-maximal

name: Test Unit

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  # Install packages into system environment.
  # Follows: https://docs.astral.sh/uv/guides/integration/github/#using-uv-pip
  UV_SYSTEM_PYTHON: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-code-changes:
    name: Detect Code Changes
    runs-on: ubuntu-latest
    outputs:
      run-tests: ${{ steps.filter.outputs.run-tests == 'true' || steps.filter.outputs.this-workflow == 'true' }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          # Run unless the change provably cannot affect this job.
          #
          # 'some-with-excludes' (dorny/paths-filter >= v4.0.3): a file counts if it
          # matches at least one positive pattern AND no negated pattern. At least one
          # positive pattern is required, hence the leading '**'.
          #
          # Exclusions are final: a file excluded by '!.github/**' cannot be included
          # back by a later pattern. Edits to this workflow are therefore picked up by
          # the separate 'this-workflow' filter, OR-ed into the job output above.
          #
          # Denylist rather than allowlist on purpose: a new top-level directory should
          # run CI by default instead of silently skipping it.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            run-tests:
              - '**'
              - '!docs/**'
              - '!docker/**'
              - '!.github/**'
            this-workflow:
              - '.github/workflows/test_unit.yml'
  test-unit-shard:
    name: Test Unit Shard (${{ matrix.runner }}, ${{ matrix.group }}/${{ matrix.splits }})
    needs: detect-code-changes
    if: needs.detect-code-changes.outputs.run-tests == 'true'
    strategy:
      matrix:
        # Splits are balanced by test durations in .test_durations.
        include:
          - { runner: ubuntu-latest, splits: 2, group: 1 }
          - { runner: ubuntu-latest, splits: 2, group: 2 }
          - { runner: windows-latest, splits: 3, group: 1 }
          - { runner: windows-latest, splits: 3, group: 2 }
          - { runner: windows-latest, splits: 3, group: 3 }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Set Up uv
        uses: astral-sh/setup-uv@v7
        id: setup-uv
        with:
          version: 0.11.15
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
      - name: Set Up Environment
        run: |
          make install-pinned-3.13
      - name: Run Pytest
        run: |
          make test-ci-maximal PYTEST_ARGS="--splits ${{ matrix.splits }} --group ${{ matrix.group }}"
  # TODO: Temporary. Remove once .test_durations is committed.
  store-test-durations:
    name: Store Test Durations
    needs: detect-code-changes
    if: needs.detect-code-changes.outputs.run-tests == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Set Up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: 0.11.15
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
      - name: Set Up Environment
        run: |
          make install-pinned-3.13
      - name: Run Pytest
        run: |
          make test-ci-maximal PYTEST_ARGS="--store-durations"
      - name: Upload Test Durations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-durations
          path: .test_durations
          include-hidden-files: true
  # Keeps the check names required by the main branch ruleset. Each check reports the
  # result of all shards.
  test-unit:
    name: Test Unit (${{ matrix.runner }})
    needs: [detect-code-changes, test-unit-shard]
    if: always()
    strategy:
      matrix:
        runner: ["ubuntu-latest", "windows-latest"]
    runs-on: ubuntu-latest
    steps:
      - name: Check Shard Results
        run: |
          echo "detect-code-changes: ${{ needs.detect-code-changes.result }}"
          echo "test-unit-shard: ${{ needs.test-unit-shard.result }}"
          test "${{ needs.detect-code-changes.result }}" = "success"
          test "${{ needs.test-unit-shard.result }}" = "success" -o "${{ needs.test-unit-shard.result }}" = "skipped"

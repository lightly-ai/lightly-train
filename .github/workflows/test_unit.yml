name: Test Unit

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

env:
  # Install packages into system environment.
  # Follows: https://docs.astral.sh/uv/guides/integration/github/#using-uv-pip
  UV_SYSTEM_PYTHON: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-code-changes:
    name: Detect Code Changes
    runs-on: ubuntu-latest
    outputs:
      run-tests: ${{ steps.filter.outputs.run-tests }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          # Allowlist: run only if the change touches a file this job reads. A new
          # folder that the job depends on must be added here, otherwise changes to it
          # silently skip this job.
          #
          # Positive patterns are OR-ed by dorny/paths-filter, so each entry is purely
          # additive.
          filters: |
            run-tests:
              - 'src/**'
              - 'tests/**'
              - 'templates/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Makefile'
              - '.test_durations'
              - '.github/workflows/test_unit.yml'
  test-unit-shard:
    name: Test Unit Shard (${{ matrix.runner }}, ${{ matrix.group }}/${{ matrix.splits }})
    needs: detect-code-changes
    if: needs.detect-code-changes.outputs.run-tests == 'true'
    strategy:
      matrix:
        # Splits are balanced by test durations in .test_durations.
        include:
          - { runner: ubuntu-latest, splits: 2, group: 1 }
          - { runner: ubuntu-latest, splits: 2, group: 2 }
          - { runner: windows-latest, splits: 3, group: 1 }
          - { runner: windows-latest, splits: 3, group: 2 }
          - { runner: windows-latest, splits: 3, group: 3 }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Set Up uv
        uses: astral-sh/setup-uv@v7
        id: setup-uv
        with:
          version: 0.11.15
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
      - name: Set Up Environment
        run: |
          make install-pinned-3.13
      - name: Run Pytest
        run: |
          make test-ci-maximal PYTEST_ARGS="--splits ${{ matrix.splits }} --group ${{ matrix.group }}"
  # Keeps the check names required by the main branch ruleset. Each check reports the
  # result of all shards.
  test-unit:
    name: Test Unit (${{ matrix.runner }})
    needs: [detect-code-changes, test-unit-shard]
    if: always()
    strategy:
      matrix:
        runner: ["ubuntu-latest", "windows-latest"]
    runs-on: ubuntu-latest
    steps:
      - name: Check Shard Results
        run: |
          echo "detect-code-changes: ${{ needs.detect-code-changes.result }}"
          echo "test-unit-shard: ${{ needs.test-unit-shard.result }}"
          test "${{ needs.detect-code-changes.result }}" = "success"
          test "${{ needs.test-unit-shard.result }}" = "success" -o "${{ needs.test-unit-shard.result }}" = "skipped"

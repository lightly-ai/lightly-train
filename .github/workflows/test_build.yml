name: Test Build

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

env:
  # Install packages into system environment.
  # Follows: https://docs.astral.sh/uv/guides/integration/github/#using-uv-pip
  UV_SYSTEM_PYTHON: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-code-changes:
    name: Detect Code Changes
    runs-on: ubuntu-latest
    outputs:
      run-tests: ${{ steps.filter.outputs.run-tests }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          # Allowlist: run only if the change touches a file this job reads. A new
          # folder that the job depends on must be added here, otherwise changes to it
          # silently skip this job.
          #
          # Positive patterns are OR-ed by dorny/paths-filter, so each entry is purely
          # additive.
          filters: |
            run-tests:
              - 'src/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Makefile'
              - 'README.md'
              - 'LICENSE'
              - '.github/workflows/test_build.yml'
  test-build:
    name: Test Build
    needs: detect-code-changes
    if: needs.detect-code-changes.outputs.run-tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Set Up uv
        uses: astral-sh/setup-uv@v7
        id: setup-uv
        with:
          version: 0.11.15
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
      - name: Set Up Environment
        run: |
          make install-dist
      - name: Build
        run: |
          make dist

name: Check Code Format

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  # Install packages into system environment.
  # Follows: https://docs.astral.sh/uv/guides/integration/github/#using-uv-pip
  UV_SYSTEM_PYTHON: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# NOTE: This workflow deliberately has no path filter. Its checks cover the whole
# repository: mdformat runs on .github, docker, docs, src, tests,
# inference_benchmarks and the root *.md files, ruff runs on ".", mypy runs on src,
# tests, docs/format_code.py and inference_benchmarks, and pre-commit runs with
# --all-files. Skipping it for "non-code" changes would stop catching formatting
# errors in exactly those files.
jobs:
  check-code-format:
    name: Check Code Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Set Up uv
        uses: astral-sh/setup-uv@v7
        id: setup-uv
        with:
          version: 0.11.15
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
      - name: Set Up Environment
        run: |
          make install-pinned-3.13
      - name: Run Format Check
        run: |
          make format-check
      - name: Run Type Check
        run: |
          make type-check
      - name: Run Header Check
        run: |
          make add-header
          git diff --name-only .
          git diff --quiet --name-only . || exit -1

name: Test Unit Minimal Dependencies

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

env:
  # Install packages into system environment.
  # Follows: https://docs.astral.sh/uv/guides/integration/github/#using-uv-pip
  UV_SYSTEM_PYTHON: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-code-changes:
    name: Detect Code Changes
    runs-on: ubuntu-latest
    outputs:
      run-tests: ${{ steps.filter.outputs.run-tests }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          # Allowlist: run only if the change touches a file this job reads. A new
          # folder that the job depends on must be added here, otherwise changes to it
          # silently skip this job.
          #
          # Positive patterns are OR-ed by dorny/paths-filter, so each entry is purely
          # additive.
          filters: |
            run-tests:
              - 'src/**'
              - 'tests/**'
              - 'templates/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Makefile'
              - '.test_durations'
              - '.github/workflows/test_unit_minimal_dependencies.yml'
  test-unit-minimal-dependencies-shard:
    name: Test Unit Minimal Dependencies Shard (${{ matrix.dependencies }}, ${{ matrix.group }}/${{ matrix.splits }})
    needs: detect-code-changes
    if: needs.detect-code-changes.outputs.run-tests == 'true'
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        dependencies: ["minimal", "minimal-extras"]
        # Splits are balanced by test durations in .test_durations.
        splits: [2]
        group: [1, 2]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Set Up uv
        uses: astral-sh/setup-uv@v7
        id: setup-uv
        with:
          version: 0.11.15
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
      - name: Set Up Environment
        run: |
          make install-${{ matrix.dependencies }}
      - name: Run Pytest
        run: |
          make test-ci-minimal PYTEST_ARGS="--splits ${{ matrix.splits }} --group ${{ matrix.group }}"
  # Keeps the check names required by the main branch ruleset. Each check reports the
  # result of all shards.
  test-unit-minimal-dependencies:
    name: Test Unit Minimal Dependencies (${{ matrix.dependencies }})
    needs: [detect-code-changes, test-unit-minimal-dependencies-shard]
    if: always()
    strategy:
      matrix:
        dependencies: ["minimal", "minimal-extras"]
    runs-on: ubuntu-latest
    steps:
      - name: Check Shard Results
        run: |
          echo "detect-code-changes: ${{ needs.detect-code-changes.result }}"
          echo "test-unit-minimal-dependencies-shard: ${{ needs.test-unit-minimal-dependencies-shard.result }}"
          test "${{ needs.detect-code-changes.result }}" = "success"
          test "${{ needs.test-unit-minimal-dependencies-shard.result }}" = "success" -o "${{ needs.test-unit-minimal-dependencies-shard.result }}" = "skipped"

name: Test Unit Minimal Dependencies

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  # Install packages into system environment.
  # Follows: https://docs.astral.sh/uv/guides/integration/github/#using-uv-pip
  UV_SYSTEM_PYTHON: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-code-changes:
    name: Detect Code Changes
    runs-on: ubuntu-latest
    outputs:
      run-tests: ${{ steps.filter.outputs.run-tests == 'true' || steps.filter.outputs.this-workflow == 'true' }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          # Run unless the change provably cannot affect this job.
          #
          # 'some-with-excludes' (dorny/paths-filter >= v4.0.3): a file counts if it
          # matches at least one positive pattern AND no negated pattern. At least one
          # positive pattern is required, hence the leading '**'.
          #
          # Exclusions are final: a file excluded by '!.github/**' cannot be included
          # back by a later pattern. Edits to this workflow are therefore picked up by
          # the separate 'this-workflow' filter, OR-ed into the job output above.
          #
          # Denylist rather than allowlist on purpose: a new top-level directory should
          # run CI by default instead of silently skipping it.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            run-tests:
              - '**'
              - '!docs/**'
              - '!docker/**'
              - '!.github/**'
            this-workflow:
              - '.github/workflows/test_unit_minimal_dependencies.yml'
  # The two jobs below do not use a matrix. This is deliberate.
  #
  # GitHub does not expand a matrix for a job that it skips. Such a job reports one check
  # with the plain job name, 'Test Unit Minimal Dependencies'. The branch ruleset requires
  # the names with the matrix value, 'Test Unit Minimal Dependencies (minimal)' and
  # 'Test Unit Minimal Dependencies (minimal-extras)'. Those names only exist when the job
  # runs. As a result, a pull request that skips the tests waits forever for a check that
  # never arrives.
  #
  # A job without a matrix always reports the same name. Keep these jobs separate.
  test-unit-minimal-dependencies-minimal:
    name: Test Unit Minimal Dependencies (minimal)
    needs: detect-code-changes
    if: needs.detect-code-changes.outputs.run-tests == 'true'
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Set Up uv
        uses: astral-sh/setup-uv@v7
        id: setup-uv
        with:
          version: 0.11.15
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
      - name: Set Up Environment
        run: |
          make install-minimal
      - name: Run Pytest
        run: |
          make test-ci-minimal
  test-unit-minimal-dependencies-minimal-extras:
    name: Test Unit Minimal Dependencies (minimal-extras)
    needs: detect-code-changes
    if: needs.detect-code-changes.outputs.run-tests == 'true'
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Set Up uv
        uses: astral-sh/setup-uv@v7
        id: setup-uv
        with:
          version: 0.11.15
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
      - name: Set Up Environment
        run: |
          make install-minimal-extras
      - name: Run Pytest
        run: |
          make test-ci-minimal
